  <path d="M0 0h1440v6H0z" fill="url(#red)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="68" y="57" width="8" height="8" rx="4" fill="#ff453e"/>
    <text x="90" y="67" fill="#c7ccd5" font-size="13" font-weight="700" letter-spacing="3">DRIVER PROFILE / NF</text>
    <text x="68" y="173" fill="#f5f6f8" font-size="72" font-weight="900" letter-spacing="-3">NIGEL</text>
    <text x="65" y="255" fill="#f5f6f8" font-size="80" font-weight="900" letter-spacing="-3">FERNANDES</text>
    <rect x="69" y="286" width="68" height="5" fill="url(#red)"/>
    <text x="68" y="330" fill="#b7bdc8" font-size="21">Engineering curiosity. Creative instinct.</text>
    <text x="68" y="367" fill="#808a9b" font-size="13" letter-spacing="2.5">TECH / DESIGN / MUSIC</text>
    <path d="M68 422H1372" stroke="#30353e"/>
    <text x="68" y="464" fill="#bec5cf" font-size="12" font-weight="700" letter-spacing="2">MUMBAI, IN</text>
    <text x="325" y="464" fill="#bec5cf" font-size="12" font-weight="700" letter-spacing="2">ELECTRONICS &amp; COMPUTER SCIENCE</text>
    <text x="1372" y="464" text-anchor="end" fill="#818a99" font-size="12" letter-spacing="2">ALWAYS LEARNING ↗</text>
    <text x="1127" y="240" text-anchor="middle" fill="#fff" opacity=".055" font-size="158" font-weight="900" font-style="italic">NF</text>
    <text x="1125" y="362" text-anchor="middle" fill="#959fae" font-size="11" letter-spacing="3">THE NEXT LAP STARTS HERE</text>
  </g>
