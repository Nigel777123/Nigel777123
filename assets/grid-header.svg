<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">Nigel Fernandes — Driver Profile</title>
  <desc id="desc">A charcoal and racing-red motorsport graphic with Nigel Fernandes's name, a stylized circuit and an NF monogram.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#191d25"/><stop offset="1" stop-color="#090b10"/></linearGradient>
    <linearGradient id="red" x2="1" y2="0"><stop stop-color="#ff453e"/><stop offset="1" stop-color="#d51626"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
    <pattern id="checks" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 0h12v12H0zM12 12h12v12H12z" fill="#f5f5f5"/></pattern>
  </defs>
  <rect width="1440" height="520" rx="20" fill="url(#bg)"/>
